name: Build DLSS Release

on:
  push:
    branches:
      - dlss-poc
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

concurrency:
  group: build-dlss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-dlss:
    name: Windows x64 Clang Release + DLSS
    runs-on: windows-latest

    env:
      CMAKE_PRESET: x64-Clang-Release
      STREAMLINE_VERSION: 2.12.0
      PRIVATE_ASSET_REPO: slopmaster9000/MarathonRecompPrivate
      # Keep MarathonRecomp's vcpkg manifest baseline pinned, but use current
      # vcpkg tooling so auxiliary MSYS2 packages still exist on public mirrors.
      VCPKG_TOOL_REV: 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4

    steps:
      - name: Check private asset token
        shell: pwsh
        env:
          ASSET_REPO_TOKEN: ${{ secrets.ASSET_REPO_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ASSET_REPO_TOKEN)) {
            Write-Error "Set repository Actions secret ASSET_REPO_TOKEN before running the DLSS build."
            exit 1
          }

      - name: Verify private asset repository access
        shell: pwsh
        env:
          ASSET_REPO_TOKEN: ${{ secrets.ASSET_REPO_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:ASSET_REPO_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          try {
            $repo = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/$env:PRIVATE_ASSET_REPO" `
              -Headers $headers `
              -Method Get
            Write-Host "Authenticated private asset repository: $($repo.full_name)"
          }
          catch {
            Write-Error "ASSET_REPO_TOKEN cannot read $env:PRIVATE_ASSET_REPO. Recreate the fine-grained PAT with resource owner 'slopmaster9000', repository access to 'MarathonRecompPrivate', and Repository permissions -> Contents: Read-only, then replace the ASSET_REPO_TOKEN Actions secret."
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Checkout private game assets
        uses: actions/checkout@v7
        with:
          repository: slopmaster9000/MarathonRecompPrivate
          ref: main
          token: ${{ secrets.ASSET_REPO_TOKEN }}
          path: .\private
          persist-credentials: false

      - name: Refresh vcpkg tool scripts
        shell: pwsh
        run: |
          Write-Host "MarathonRecomp manifest baseline remains pinned by vcpkg.json."
          Write-Host "Refreshing vcpkg tooling to $env:VCPKG_TOOL_REV to avoid removed MSYS2 bootstrap packages."
          git -C .\thirdparty\vcpkg fetch --no-tags --depth=1 origin $env:VCPKG_TOOL_REV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C .\thirdparty\vcpkg checkout --detach $env:VCPKG_TOOL_REV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C .\thirdparty\vcpkg rev-parse HEAD

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ccache-${{ runner.os }}-dlss-${{ env.CMAKE_PRESET }}

      - name: Cache vcpkg
        uses: actions/cache@v6.1.0
        with:
          path: |
            ./thirdparty/vcpkg/downloads
            ./thirdparty/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TOOL_REV }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TOOL_REV }}-

      - name: Install dependencies
        shell: pwsh
        run: |
          choco install ninja -y
          Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue

      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare game assets
        shell: pwsh
        run: |
          $required = @("default.xex", "shader.arc", "shader_lt.arc")
          foreach ($file in $required) {
            $source = Join-Path ".\private" $file
            if (-not (Test-Path $source)) {
              Write-Error "Missing required game asset in the private repository: $file"
              exit 1
            }
          }
          Copy-Item .\private\* .\MarathonRecompLib\private -Force

      - name: Download Streamline SDK 2.12.0
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "streamline-sdk-v$env:STREAMLINE_VERSION.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "streamline-sdk"
          $url = "https://github.com/NVIDIA-RTX/Streamline/releases/download/v$env:STREAMLINE_VERSION/streamline-sdk-v$env:STREAMLINE_VERSION.zip"

          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extractRoot -Force

          $slHeader = Get-ChildItem -Path $extractRoot -Recurse -File -Filter "sl.h" |
            Where-Object { $_.Directory.Name -eq "include" } |
            Select-Object -First 1

          if (-not $slHeader) {
            Write-Error "Could not locate include/sl.h in the extracted Streamline SDK."
            exit 1
          }

          $sdkRoot = Split-Path $slHeader.DirectoryName -Parent
          "STREAMLINE_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Streamline SDK root: $sdkRoot"

      - name: Configure DLSS build
        shell: pwsh
        run: |
          cmake . --preset $env:CMAKE_PRESET `
            -DSDL2MIXER_VORBIS=VORBISFILE `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DMARATHON_RECOMP_D3D12=ON `
            -DMARATHON_RECOMP_DLSS=ON `
            "-DSTREAMLINE_SDK_ROOT=$env:STREAMLINE_SDK_ROOT"

      - name: Build DLSS release
        shell: pwsh
        run: cmake --build .\out\build\${{ env.CMAKE_PRESET }} --target MarathonRecomp

      - name: Verify Streamline runtime
        shell: pwsh
        run: |
          $buildOut = ".\out\build\$env:CMAKE_PRESET\MarathonRecomp"
          $required = @(
            "sl.interposer.dll",
            "sl.common.dll",
            "sl.pcl.dll",
            "sl.dlss.dll",
            "nvngx_dlss.dll"
          )

          foreach ($file in $required) {
            $path = Join-Path $buildOut $file
            if (-not (Test-Path $path)) {
              Write-Error "DLSS build completed but required Streamline runtime file is missing: $file"
              exit 1
            }
          }

      - name: Pack release
        shell: pwsh
        run: |
          $buildOut = ".\out\build\$env:CMAKE_PRESET\MarathonRecomp"
          $release = ".\release"

          New-Item -ItemType Directory -Path $release -Force | Out-Null

          Copy-Item "$buildOut\MarathonRecomp.exe" $release -Force
          Get-ChildItem "$buildOut\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $release -Force
          Get-ChildItem "$buildOut\*.json" -ErrorAction SilentlyContinue | Copy-Item -Destination $release -Force

          if (Test-Path "$buildOut\D3D12") {
            Copy-Item "$buildOut\D3D12" "$release\D3D12" -Recurse -Force
          }

          Write-Host "Release contents:"
          Get-ChildItem $release -Recurse | ForEach-Object { Write-Host $_.FullName }

      - name: Upload DLSS artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: MarathonRecomp-Windows-x64-Clang-Release-DLSS
          path: .\release
          if-no-files-found: error
