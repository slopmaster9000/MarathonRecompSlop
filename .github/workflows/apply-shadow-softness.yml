name: Apply Shadow Softness

on:
  push:
    branches:
      - shadow-softness

concurrency:
  group: shadow-softness-patcher
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: shadow-softness
          fetch-depth: 0

      - name: Apply runtime shadow softness implementation
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_shadow_softness.py
          python3 /tmp/patch_shadow_softness.py

      - name: Commit implementation source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MarathonRecomp/ui/options_menu.cpp \
                  MarathonRecomp/locale/config_locale.cpp \
                  MarathonRecomp/gpu/video.cpp \
                  MarathonRecompLib/CMakeLists.txt
          git add -f MarathonRecompLib/shader/marathon_shader_common.h
          git commit -m "Add runtime shadow softness control"
          git push origin HEAD:shadow-softness
